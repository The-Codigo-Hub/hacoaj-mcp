# Entorno local: WordPress + MariaDB con los CPT/taxonomías de hacoaj.org.ar y datos del snapshot real.
#   docker compose -f dev/docker-compose.yml up -d
#   docker compose -f dev/docker-compose.yml run --rm cli bash /plugin/dev/setup.sh
# WordPress queda en http://localhost:8088 (admin / admin)
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'http://localhost:8088' );
        define( 'WP_SITEURL', 'http://localhost:8088' );
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/hacoaj-mcp
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins

  cli:
    image: wordpress:cli-php8.2
    depends_on:
      - wordpress
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/hacoaj-mcp
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ..:/plugin
    profiles: ["cli"]

volumes:
  wp:
