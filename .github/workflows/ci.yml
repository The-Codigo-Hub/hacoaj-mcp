name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: find . -name '*.php' -not -path './dev/*' -print0 | xargs -0 -n1 php -l
      - name: Validar catálogo JSON
        run: php -r 'json_decode(file_get_contents("data/catalog.json"), true, 512, JSON_THROW_ON_ERROR); echo "catalog.json OK\n";'
      - name: Tests
        run: php tests/run.php
